# ─────────────────────────────────────────────────────────────
#  Spendi configuration — edit this file, then restart the app.
# ─────────────────────────────────────────────────────────────

bot_name: Spendi
currency: MXN                      # all budgets are in this currency
timezone: America/Mexico_City      # decides what "today", "this week", "this cycle" mean

# Day of the month when each budget cycle starts (1–28).
# 16 → cycles run 16 Aug – 15 Sep, 16 Sep – 15 Oct, ...  Use 1 for normal calendar months.
budget_cycle_start_day: 16

# WhatsApp numbers allowed to use Spendi (international format).
# Messages from any other number are ignored.
users:
  "+528122000899": Diego
  "+528117990478": Romi

# Optional: convert expenses written in other currencies ("20 usd uber").
fx_rates:
  USD: 17.0
  EUR: 19.5

# Where anything that doesn't fit goes. It has no budget; its spending is just tracked.
fallback_category: Other

# scope: shared   → one budget for the household, no matter who paid
# scope: personal → one budget per person; the expense goes to whoever sent the message
#                   (or to the other person if the message says "for Romi")
# type: goal      → a target to reach (savings) instead of a limit to stay under
# monthly         → monthly budget. Weekly budget = monthly × 12 ÷ 52
# keywords        → merchant hints (help Claude, and power the offline fallback parser)
# split_keywords  → (personal categories) things you share: split 50/50 between both personal budgets
#
# Monthly total: $90,000 spending (20k groceries + 45k rent + 5k transport + 2×10k personal) + $10,000 savings
categories:
  Groceries:
    scope: shared
    emoji: "🛒"
    monthly: 20000
    description: Supermarkets, food and household supplies for home, food delivery apps (Uber Eats, Rappi), pet food and pet supplies, Amazon household orders, car wash
    keywords: [uber eats, rappi, didi food, delivery, a domicilio, pet, mascota, petco, petsmart, tomlinson, car wash, autolavado, central market, sprouts, wheatsville, farmers market,
               super, supermercado, groceries, despensa, whole foods, walmart, soriana, chedraui, costco, sams, heb, la comer, city market, superama, bodega aurrera, oxxo, 7-eleven, mercado, verduras, carniceria, panaderia]

  Personal Expenses:
    scope: personal
    emoji: "👤"
    monthly:
      Diego: 10000
      Romi: 10000
    description: Things one person buys mainly for themself — clothes, shoes, cosmetics, beauty, haircuts, sports gear, gym, personal gadgets and hobbies
    keywords: [personal, personales, sephora, nike, adidas, puma, zara, h&m, bershka, pull&bear, mango, liverpool, palacio de hierro, sanborns, mac, ulta, barberia, salon, gym, smart fit,
               shoes, zapatos, tenis, sneakers, clothes, ropa, shirt, camisa, pants, pantalon, dress, vestido, jacket, chamarra, bag, bolsa,
               makeup, maquillaje, perfume, haircut, corte de pelo, nails, uñas, gimnasio, sauna]
    split_keywords: [restaurant, restaurante, cafe, café, coffee, cafeteria, starbucks, bar, brunch, lunch, dinner, comida, cena, desayuno,
                     tacos, sushi, pizza, chipotle, vending, ticketmaster, tickets, boletos, concierto, cine, cinemark]

  Rent & Utilities:
    scope: shared
    emoji: "🏠"
    monthly: 45000
    description: Rent, electricity, water, gas, internet, phone plans, building maintenance fees
    keywords: [renta, rent, cfe, luz, agua, gas natural, naturgy, telmex, izzi, totalplay, megacable, telcel, at&t, mantenimiento]


  Transportation:
    scope: shared
    emoji: "🚗"
    monthly: 5000
    description: Gas, EV charging, Uber/Didi rides (not food delivery), parking, tolls, car maintenance
    keywords: [uber, didi, taxi, gasolina, gas station, shell, pemex, exxon, chevron, tesla, charging, parking, estacionamiento, caseta, peaje, toll, metro]

  Savings:
    scope: shared
    type: goal
    emoji: "🐷"
    monthly: 10000
    description: Money set aside — transfers to savings, investments or emergency fund. Not purchases.
    keywords: [ahorro, savings, inversion, investment, cetes, gbm, nu cajita]

  Other:
    scope: shared
    emoji: "📦"
    monthly: 0
    description: Anything that doesn't fit another category (health, gifts, travel...)
    keywords: []
